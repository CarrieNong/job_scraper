<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Job Tracker</title>
  <style>
    /* ── Reset & base ─────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:        #0f1117;
      --surface:   #1a1d27;
      --surface2:  #222533;
      --border:    #2d3148;
      --text:      #e2e6f0;
      --muted:     #7b82a0;
      --accent:    #6c8cff;

      --pending:    #3b82f6;
      --applied:    #22c55e;
      --rejected:   #ef4444;
      --interview:  #f59e0b;
      --unsuitable: #8b5cf6;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
    }

    /* ── Top nav ──────────────────────────────────────────────────── */
    header {
      position: sticky; top: 0; z-index: 100;
      background: rgba(15,17,23,.92);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 0 24px;
      height: 56px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .logo { font-size: 1.1rem; font-weight: 700; letter-spacing: .03em; color: var(--accent); text-decoration: none; }
    .header-actions { display: flex; align-items: center; gap: 10px; }
    .nav-btn {
      display: inline-flex; align-items: center; gap: 6px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      padding: 6px 14px;
      font-size: .82rem;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      transition: border-color .15s, color .15s;
    }
    .nav-btn:hover { border-color: var(--accent); color: var(--accent); }
    .nav-btn b { color: var(--muted); font-weight: 600; }

    /* ── Stats bar ────────────────────────────────────────────────── */
    .stats-bar {
      display: flex; gap: 12px; flex-wrap: wrap;
      padding: 16px 24px;
      border-bottom: 1px solid var(--border);
    }
    .stat-chip {
      display: flex; align-items: center; gap: 8px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 6px 14px;
      font-size: .8rem;
      cursor: pointer;
      transition: border-color .15s, background .15s;
    }
    .stat-chip:hover, .stat-chip.active { border-color: var(--accent); background: var(--surface2); }
    .stat-chip .dot {
      width: 8px; height: 8px; border-radius: 50%;
    }
    .dot-all        { background: var(--accent); }
    .dot-pending    { background: var(--pending); }
    .dot-applied    { background: var(--applied); }
    .dot-rejected   { background: var(--rejected); }
    .dot-interview  { background: var(--interview); }
    .dot-unsuitable { background: var(--unsuitable); }

    /* ── Pipeline funnel ──────────────────────────────────────────── */
    .funnel-bar {
      display: flex; align-items: center; flex-wrap: wrap; gap: 0;
      padding: 14px 24px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
    }
    .funnel-step {
      display: flex; flex-direction: column; align-items: center;
      gap: 4px; padding: 8px 20px;
      border-radius: 10px;
      min-width: 110px;
    }
    .funnel-num {
      font-size: 1.55rem; font-weight: 700; line-height: 1;
      color: var(--text);
    }
    .funnel-label { font-size: .73rem; color: var(--muted); white-space: nowrap; }
    .funnel-step.f-clicked  .funnel-num { color: var(--accent); }
    .funnel-step.f-german   .funnel-num { color: #ef4444; }
    .funnel-step.f-matched  .funnel-num { color: #f59e0b; }
    .funnel-step.f-applied  .funnel-num { color: var(--applied); }
    .funnel-sep {
      font-size: 1.1rem; color: var(--border);
      padding: 0 2px; flex-shrink: 0;
    }

    /* ── Toolbar ──────────────────────────────────────────────────── */
    .toolbar {
      display: flex; gap: 10px; flex-wrap: wrap; align-items: center;
      padding: 14px 24px;
      border-bottom: 1px solid var(--border);
    }
    .toolbar input[type="search"] {
      flex: 1; min-width: 200px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      padding: 8px 14px;
      font-size: .9rem;
      outline: none;
      transition: border-color .15s;
    }
    .toolbar input[type="search"]:focus { border-color: var(--accent); }
    .toolbar select {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      padding: 8px 12px;
      font-size: .9rem;
      cursor: pointer;
      outline: none;
    }
    .count-label { color: var(--muted); font-size: .85rem; margin-left: auto; }

    /* Date filter inputs */
    .toolbar input[type="date"],
    .toolbar input[type="number"] {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      padding: 8px 12px;
      font-size: .9rem;
      outline: none;
      color-scheme: dark;
    }
    .toolbar input[type="number"] { width: 78px; }
    .filter-group {
      display: flex; align-items: center; gap: 6px;
      color: var(--muted); font-size: .8rem; white-space: nowrap;
    }
    .hidden-filter { display: none !important; }

    /* ── Date group header ────────────────────────────────────────── */
    .date-group-header {
      grid-column: 1 / -1;
      display: flex; align-items: center; gap: 10px;
      font-size: .8rem; font-weight: 700;
      color: var(--muted);
      padding: 12px 2px 6px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 2px;
    }
    .date-group-header .dg-count {
      font-weight: 500;
      font-size: .75rem;
      color: var(--border);
    }

    /* ── Job grid ─────────────────────────────────────────────────── */
    .job-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
      gap: 16px;
      padding: 20px 24px 40px;
    }

    /* ── Job card ─────────────────────────────────────────────────── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 20px;
      display: flex; flex-direction: column; gap: 14px;
      transition: border-color .2s, transform .15s, box-shadow .2s;
      position: relative;
    }
    .card:hover {
      border-color: var(--accent);
      box-shadow: 0 0 0 1px var(--accent)22, 0 8px 32px #0008;
      transform: translateY(-2px);
    }

    .card-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
    .card-title-block { flex: 1; min-width: 0; }
    .card-title {
      font-size: 1rem; font-weight: 600; line-height: 1.4;
      color: var(--text);
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .card-company { font-size: .8rem; color: var(--muted); margin-top: 3px; }

    .score-badge {
      flex-shrink: 0;
      width: 40px; height: 40px;
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: .85rem; font-weight: 700;
      border: 2px solid;
    }
    .score-hi  { color: #22c55e; border-color: #22c55e33; background: #22c55e10; }
    .score-mid { color: #f59e0b; border-color: #f59e0b33; background: #f59e0b10; }
    .score-lo  { color: #ef4444; border-color: #ef444433; background: #ef444410; }

    /* Meta row */
    .card-meta { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .meta-pill {
      font-size: .72rem;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 2px 8px;
      color: var(--muted);
    }
    .source-pill { text-transform: capitalize; }

    /* Summary */
    .card-summary {
      font-size: .82rem; color: var(--muted); line-height: 1.55;
      display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* Job Wizard breakdown */
    .breakdown {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 12px;
    }
    .breakdown + .breakdown { margin-top: -6px; }
    .breakdown summary {
      cursor: pointer;
      font-size: .78rem;
      font-weight: 600;
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      list-style: none;
    }
    .breakdown summary::-webkit-details-marker { display: none; }
    .breakdown summary::before {
      content: "▸";
      color: var(--muted);
      font-size: .7rem;
      flex-shrink: 0;
    }
    .breakdown[open] summary::before { content: "▾"; }
    .bd-count {
      margin-left: auto;
      font-weight: 500;
      color: var(--muted);
      font-size: .72rem;
    }
    .bd-list {
      margin: 8px 0 2px;
      padding-left: 0;
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .bd-list li {
      font-size: .75rem;
      line-height: 1.45;
      padding-left: 2px;
    }
    .bd-ok { color: #86efac; }
    .bd-no { color: #fca5a5; }

    /* Apply button */
    .btn-apply {
      display: inline-flex; align-items: center; gap: 6px;
      background: var(--accent);
      color: #fff;
      border: none; border-radius: 8px;
      padding: 8px 14px;
      font-size: .82rem; font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: opacity .15s, transform .1s;
      width: fit-content;
    }
    .btn-apply:hover { opacity: .88; transform: scale(1.02); }
    .btn-apply.btn-applied { background: var(--surface2); color: var(--muted); border: 1px solid var(--border); }

    /* Status select */
    .status-row { display: flex; gap: 8px; align-items: center; }
    .status-select {
      flex: 1;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      padding: 7px 10px;
      font-size: .82rem;
      cursor: pointer;
      outline: none;
      transition: border-color .15s;
    }
    .status-select:focus { border-color: var(--accent); }
    .status-select.s-pending    { border-color: var(--pending);    color: var(--pending); }
    .status-select.s-applied    { border-color: var(--applied);    color: var(--applied); }
    .status-select.s-rejected   { border-color: var(--rejected);   color: var(--rejected); }
    .status-select.s-interview  { border-color: var(--interview);  color: var(--interview); }
    .status-select.s-unsuitable { border-color: var(--unsuitable); color: var(--unsuitable); }

    /* Notes */
    .notes-wrap { display: flex; flex-direction: column; gap: 6px; }
    .notes-textarea {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      padding: 8px 10px;
      font-size: .8rem;
      line-height: 1.5;
      resize: vertical;
      min-height: 60px;
      outline: none;
      font-family: inherit;
      transition: border-color .15s;
    }
    .notes-textarea:focus { border-color: var(--accent); }
    .notes-textarea::placeholder { color: var(--muted); }
    .btn-save {
      align-self: flex-end;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--muted);
      padding: 4px 12px;
      font-size: .75rem;
      cursor: pointer;
      transition: border-color .15s, color .15s;
    }
    .btn-save:hover { border-color: var(--accent); color: var(--accent); }
    .btn-save.saved { border-color: #22c55e; color: #22c55e; }

    /* ── Empty state ──────────────────────────────────────────────── */
    .empty {
      grid-column: 1 / -1;
      text-align: center;
      padding: 80px 20px;
      color: var(--muted);
    }
    .empty h2 { font-size: 1.2rem; margin-bottom: 8px; }

    /* ── Loading ──────────────────────────────────────────────────── */
    .spinner {
      width: 36px; height: 36px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin .7s linear infinite;
      margin: 80px auto;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Toast ────────────────────────────────────────────────────── */
    .toast {
      position: fixed; bottom: 24px; right: 24px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 18px;
      font-size: .85rem;
      box-shadow: 0 8px 32px #0008;
      transform: translateY(80px); opacity: 0;
      transition: transform .25s, opacity .25s;
      pointer-events: none;
      z-index: 999;
    }
    .toast.show { transform: translateY(0); opacity: 1; }
    .toast.ok   { border-color: #22c55e; color: #22c55e; }
    .toast.err  { border-color: #ef4444; color: #ef4444; }
  </style>
</head>
<body>

<!-- ── Header ──────────────────────────────────────────────────────── -->
<header>
  <a class="logo" href="/">💼 Job Tracker</a>
  <div class="header-actions">
    <a class="nav-btn" href="/manual-apply">✍️ Log Applied</a>
    <a class="nav-btn" href="/unmatched">Unmatched Jobs <b id="unmatchedNavCount"></b></a>
    <button id="refreshBtn" class="btn-save" onclick="loadJobs()" style="padding:6px 14px;font-size:.82rem;">↻ Refresh</button>
  </div>
</header>

<!-- ── Pipeline funnel ─────────────────────────────────────────────── -->
<div class="funnel-bar" id="funnelBar">
  <div class="funnel-step f-clicked">
    <div class="funnel-num" id="f-clicked">–</div>
    <div class="funnel-label">Title Passed · Clicked</div>
  </div>
  <div class="funnel-sep">▸</div>
  <div class="funnel-step f-german">
    <div class="funnel-num" id="f-german">–</div>
    <div class="funnel-label">German Filtered</div>
  </div>
  <div class="funnel-sep">▸</div>
  <div class="funnel-step f-matched">
    <div class="funnel-num" id="f-matched">–</div>
    <div class="funnel-label">AI Matched</div>
  </div>
  <div class="funnel-sep">▸</div>
  <div class="funnel-step f-applied">
    <div class="funnel-num" id="f-applied">–</div>
    <div class="funnel-label">Applied</div>
  </div>
</div>

<!-- ── Stats bar ───────────────────────────────────────────────────── -->
<div class="stats-bar" id="statsBar">
  <div class="stat-chip active" data-status="all"   onclick="setStatusFilter('all')">
    <span class="dot dot-all"></span>
    <span>All <b id="cnt-all">–</b></span>
  </div>
  <div class="stat-chip" data-status="pending"   onclick="setStatusFilter('pending')">
    <span class="dot dot-pending"></span>
    <span>Not Applied <b id="cnt-pending">–</b></span>
  </div>
  <div class="stat-chip" data-status="applied"   onclick="setStatusFilter('applied')">
    <span class="dot dot-applied"></span>
    <span>Applied <b id="cnt-applied">–</b></span>
  </div>
  <div class="stat-chip" data-status="interview" onclick="setStatusFilter('interview')">
    <span class="dot dot-interview"></span>
    <span>Interview <b id="cnt-interview">–</b></span>
  </div>
  <div class="stat-chip" data-status="rejected"  onclick="setStatusFilter('rejected')">
    <span class="dot dot-rejected"></span>
    <span>Rejected <b id="cnt-rejected">–</b></span>
  </div>
  <div class="stat-chip" data-status="unsuitable" onclick="setStatusFilter('unsuitable')">
    <span class="dot dot-unsuitable"></span>
    <span>Unsuitable <b id="cnt-unsuitable">–</b></span>
  </div>
</div>

<!-- ── Toolbar ─────────────────────────────────────────────────────── -->
<div class="toolbar">
  <input type="search" id="searchInput" placeholder="🔍 Search jobs / company…" oninput="debounceLoad()" />
  <select id="sourceFilter" onchange="loadJobs()">
    <option value="all">All Sources</option>
    <option value="linkedin">LinkedIn</option>
    <option value="indeed">Indeed</option>
  </select>
  <select id="timePreset" onchange="onTimePresetChange()">
    <option value="all">All Time</option>
    <option value="today">Today</option>
    <option value="3">Last 3 Days</option>
    <option value="7">Last 7 Days</option>
    <option value="30">Last 30 Days</option>
    <option value="custom">Custom Time</option>
  </select>
  <div class="filter-group hidden-filter" id="customDateGroup">
    <input type="date" id="dateFrom" />
    <span>to</span>
    <input type="date" id="dateTo" />
  </div>
  <span class="count-label" id="countLabel"></span>
</div>

<!-- ── Job grid ────────────────────────────────────────────────────── -->
<div class="job-grid" id="jobGrid">
  <div class="spinner"></div>
</div>

<!-- ── Toast ───────────────────────────────────────────────────────── -->
<div class="toast" id="toast"></div>

<script>
/* ── State ───────────────────────────────────────────────────────── */
let currentStatusFilter = 'all';
let debounceTimer = null;
let dateDebounceTimer = null;

const STATUS_LABEL = {
  pending:    'Not Applied',
  applied:    'Applied',
  rejected:   'Rejected',
  interview:  'Interview',
  unsuitable: 'Unsuitable',
};

/* ── Toast ───────────────────────────────────────────────────────── */
function showToast(msg, type = 'ok') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = `toast ${type} show`;
  setTimeout(() => { t.className = 'toast'; }, 2500);
}

/* ── Stats bar + funnel ──────────────────────────────────────────── */
async function loadStats() {
  try {
    const res = await fetch('/api/stats');
    const data = await res.json();

    // Filter chips (existing)
    document.getElementById('cnt-all').textContent = data.total;
    const unmatchedEl = document.getElementById('unmatchedNavCount');
    if (unmatchedEl) {
      unmatchedEl.textContent = typeof data.unmatched === 'number' ? `(${data.unmatched})` : '';
    }
    for (const [status, cnt] of Object.entries(data.by_status)) {
      const el = document.getElementById(`cnt-${status}`);
      if (el) el.textContent = cnt;
    }
    ['pending','applied','rejected','interview','unsuitable'].forEach(s => {
      if (!data.by_status[s]) {
        const el = document.getElementById(`cnt-${s}`);
        if (el) el.textContent = 0;
      }
    });

    // Funnel (new)
    if (data.funnel) {
      document.getElementById('f-clicked').textContent = data.funnel.title_clicked;
      document.getElementById('f-german').textContent  = data.funnel.german_filtered;
      document.getElementById('f-matched').textContent = data.funnel.ai_matched;
      document.getElementById('f-applied').textContent = data.funnel.applied;
    }
  } catch (_) {}
}

/* ── Status filter ───────────────────────────────────────────────── */
function setStatusFilter(status) {
  currentStatusFilter = status;
  document.querySelectorAll('.stat-chip').forEach(el => {
    el.classList.toggle('active', el.dataset.status === status);
  });
  loadJobs();
}

/* ── Debounce search ─────────────────────────────────────────────── */
function debounceLoad() {
  clearTimeout(debounceTimer);
  debounceTimer = setTimeout(loadJobs, 350);
}

/* ── Date helpers ────────────────────────────────────────────────── */
function formatDate(date) {
  const y = date.getFullYear();
  const m = String(date.getMonth() + 1).padStart(2, '0');
  const d = String(date.getDate()).padStart(2, '0');
  return `${y}-${m}-${d}`;
}

function formatGroupDate(dateStr) {
  if (!dateStr) return 'Unknown Date';
  const today = formatDate(new Date());
  const yd = new Date(); yd.setDate(yd.getDate() - 1);
  const yesterday = formatDate(yd);
  if (dateStr === today) return `Today · ${dateStr}`;
  if (dateStr === yesterday) return `Yesterday · ${dateStr}`;
  return dateStr;
}

function onTimePresetChange() {
  const preset = document.getElementById('timePreset').value;
  document.getElementById('customDateGroup').classList.toggle('hidden-filter', preset !== 'custom');
  if (preset !== 'custom') {
    loadJobs();
  }
  // For custom, reload is triggered by the date input event listeners
}

function currentDateRange() {
  const preset = document.getElementById('timePreset').value;
  if (preset === 'all') return { from: '', to: '' };
  if (preset === 'custom') {
    return {
      from: document.getElementById('dateFrom').value,
      to:   document.getElementById('dateTo').value,
    };
  }
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  if (preset === 'today') return { from: formatDate(today), to: formatDate(today) };
  const from = new Date(today);
  from.setDate(today.getDate() - (Number(preset) - 1));
  return { from: formatDate(from), to: formatDate(today) };
}

/* ── Group jobs by date ──────────────────────────────────────────── */
function groupJobsByDate(jobs) {
  const groups = new Map();
  jobs.forEach(job => {
    const dateStr = (job.matched_at || '').split(' ')[0] || 'Unknown Date';
    if (!groups.has(dateStr)) groups.set(dateStr, []);
    groups.get(dateStr).push(job);
  });
  return [...groups.entries()];
}

/* ── Score badge class ───────────────────────────────────────────── */
function scoreCls(score) {
  if (score >= 8)  return 'score-hi';
  if (score >= 6)  return 'score-mid';
  return 'score-lo';
}

/* ── Job Wizard breakdown ────────────────────────────────────────── */
function renderBreakdown(title, section) {
  if (!section) return '';
  const matched = Array.isArray(section.matched) ? section.matched : [];
  const unmatched = Array.isArray(section.unmatched) ? section.unmatched : [];
  if (!matched.length && !unmatched.length) return '';
  const total = matched.length + unmatched.length;
  const items = [
    ...matched.map(t => `<li class="bd-ok">✓ ${escHtml(t)}</li>`),
    ...unmatched.map(t => `<li class="bd-no">✗ ${escHtml(t)}</li>`),
  ].join('');
  return `
    <details class="breakdown">
      <summary><span>${title}</span><span class="bd-count">${matched.length}/${total} matched</span></summary>
      <ul class="bd-list">${items}</ul>
    </details>`;
}

/* ── Render card ─────────────────────────────────────────────────── */
function renderCard(job) {
  const score  = (job.match_score || 0).toFixed(1);
  const status = job.status || 'pending';
  const doSection = renderBreakdown("What you'll do", job.what_youll_do);
  const lookingSection = renderBreakdown("What they're looking for", job.what_theyre_looking_for);
  const hasBreakdown = Boolean(doSection || lookingSection);
  const matchReasons = hasBreakdown
    ? ''
    : (job.match_reasons || []).slice(0, 3).map(r => `<li>${escHtml(r)}</li>`).join('');

  const card = document.createElement('div');
  card.className = 'card';
  card.id = `card-${job._id}`;

  card.innerHTML = `
    <div class="card-header">
      <div class="card-title-block">
        <div class="card-title">${escHtml(job.title || '(No Title)')}</div>
        <div class="card-company">${escHtml(job.company || '')}${job.location ? ' · ' + escHtml(job.location) : ''}</div>
      </div>
      <div class="score-badge ${scoreCls(job.match_score || 0)}">${score}</div>
    </div>

    <div class="card-meta">
      <span class="meta-pill source-pill">${escHtml(job.source || '')}</span>
      ${job.matched_at ? `<span class="meta-pill">📅 ${job.matched_at}</span>` : ''}
      ${job.applicants ? `<span class="meta-pill">👥 ${escHtml(job.applicants)}</span>` : ''}
    </div>

    ${job.summary ? `<div class="card-summary">${escHtml(job.summary)}</div>` : ''}

    ${doSection}
    ${lookingSection}

    ${matchReasons ? `<ul style="font-size:.78rem;color:var(--muted);padding-left:16px;line-height:1.6;">${matchReasons}</ul>` : ''}

    <a class="btn-apply ${status === 'applied' ? 'btn-applied' : ''}"
       href="${escHtml(job.link || '#')}" target="_blank" rel="noopener">
      ${status === 'applied' ? '🔗 View Detail' : '🚀 Apply Now'}
    </a>

    <div class="status-row">
      <select class="status-select s-${status}" data-id="${job._id}" onchange="updateStatus(this)">
        <option value="pending"    ${status==='pending'    ? 'selected':''}>📋 Not Applied</option>
        <option value="applied"    ${status==='applied'    ? 'selected':''}>✅ Applied</option>
        <option value="interview"  ${status==='interview'  ? 'selected':''}>🤝 Interview</option>
        <option value="rejected"   ${status==='rejected'   ? 'selected':''}>❌ Rejected</option>
        <option value="unsuitable" ${status==='unsuitable' ? 'selected':''}>🚫 Unsuitable</option>
      </select>
    </div>

    <div class="notes-wrap">
      <textarea
        class="notes-textarea"
        data-id="${job._id}"
        placeholder="Notes: Rejected after interview / Direct rejection / Salary mismatch…"
        rows="2"
      >${escHtml(job.notes || '')}</textarea>
      <button class="btn-save" data-id="${job._id}" onclick="saveNotes(this)">Save Notes</button>
    </div>
  `;
  return card;
}

/* ── Load jobs ───────────────────────────────────────────────────── */
async function loadJobs() {
  const grid   = document.getElementById('jobGrid');
  const search = document.getElementById('searchInput').value.trim();
  const source = document.getElementById('sourceFilter').value;
  const dates  = currentDateRange();

  grid.innerHTML = '<div class="spinner"></div>';

  const params = new URLSearchParams();
  if (currentStatusFilter !== 'all') params.set('status', currentStatusFilter);
  if (source !== 'all') params.set('source', source);
  if (search) params.set('q', search);
  if (dates.from) params.set('date_from', dates.from);
  if (dates.to)   params.set('date_to',   dates.to);

  try {
    const res  = await fetch('/api/jobs?' + params.toString());
    const data = await res.json();

    grid.innerHTML = '';
    document.getElementById('countLabel').textContent = `Total ${data.total}`;

    if (!data.jobs.length) {
      grid.innerHTML = `
        <div class="empty">
          <h2>No Matched Jobs</h2>
          <p>Try different filters?</p>
        </div>`;
      return;
    }

    // Group by date and render
    const groups = groupJobsByDate(data.jobs);
    groups.forEach(([dateStr, jobs]) => {
      const hdr = document.createElement('div');
      hdr.className = 'date-group-header';
      hdr.innerHTML = `<span>${formatGroupDate(dateStr)}</span><span class="dg-count">${jobs.length} jobs</span>`;
      grid.appendChild(hdr);
      jobs.forEach(job => grid.appendChild(renderCard(job)));
    });
  } catch (err) {
    grid.innerHTML = `<div class="empty"><h2>Loading Failed</h2><p>${err.message}</p></div>`;
  }
}

/* ── Update status ───────────────────────────────────────────────── */
async function updateStatus(select) {
  const id     = select.dataset.id;
  const status = select.value;

  // Update style immediately
  select.className = `status-select s-${status}`;

  try {
    const res = await fetch(`/api/jobs/${id}/status`, {
      method: 'PATCH',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({status}),
    });
    if (!res.ok) throw new Error('Request failed');
    showToast(`✅ Status updated to "${STATUS_LABEL[status]}"`);
    loadStats();

    // Immediately update the Apply Now ↔ View Detail button on the card
    const btn = select.closest('.status-row').previousElementSibling;
    if (btn && btn.classList.contains('btn-apply')) {
      if (status === 'applied') {
        btn.classList.add('btn-applied');
        btn.innerHTML = '🔗 View Detail';
      } else {
        btn.classList.remove('btn-applied');
        btn.innerHTML = '🚀 Apply Now';
      }
    }
  } catch (err) {
    showToast('❌ Status update failed', 'err');
  }
}

/* ── Save notes ──────────────────────────────────────────────────── */
async function saveNotes(btn) {
  const id    = btn.dataset.id;
  const card  = document.getElementById(`card-${id}`);
  const notes = card.querySelector('.notes-textarea').value;

  try {
    const res = await fetch(`/api/jobs/${id}/notes`, {
      method: 'PATCH',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({notes}),
    });
    if (!res.ok) throw new Error('Request failed');
    btn.textContent = 'Saved ✓';
    btn.classList.add('saved');
    setTimeout(() => { btn.textContent = 'Save Notes'; btn.classList.remove('saved'); }, 2000);
    showToast('📝 Notes saved');
  } catch (err) {
    showToast('❌ Notes save failed', 'err');
  }
}

/* ── Escape HTML helper ──────────────────────────────────────────── */
function escHtml(str) {
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

/* ── Init ────────────────────────────────────────────────────────── */
// Date input listeners – debounced so the native picker doesn't fire mid-pick
['dateFrom', 'dateTo'].forEach(id => {
  document.getElementById(id).addEventListener('change', function() {
    if (document.getElementById('timePreset').value === 'custom') {
      clearTimeout(dateDebounceTimer);
      dateDebounceTimer = setTimeout(loadJobs, 400);
    }
  });
});

loadStats();
loadJobs();
</script>
</body>
</html>
